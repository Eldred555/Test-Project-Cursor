<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>●× — Test Project Cursor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="stage">
      <header class="brand">
        <h1 class="logo">●×</h1>
        <p class="tagline">あなたが先行。コンピューターが後攻。</p>
      </header>

      <p id="status" class="status" role="status" aria-live="polite">
        あなたの番です（●）
      </p>

      <div
        id="board"
        class="board"
        role="grid"
        aria-label="3かける3の盤面"
      ></div>

      <div class="actions">
        <button type="button" id="restart" class="restart">もう一度</button>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
